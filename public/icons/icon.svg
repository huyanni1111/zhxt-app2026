<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  
  <!-- 书本图标 -->
  <g transform="translate(128, 128)">
    <!-- 左页 -->
    <path d="M 20 30 L 120 55 L 120 200 L 20 175 Z" fill="rgba(255,255,255,0.95)"/>
    <!-- 右页 -->
    <path d="M 236 30 L 136 55 L 136 200 L 236 175 Z" fill="rgba(255,255,255,0.95)"/>
    <!-- 书脊 -->
    <rect x="122" y="48" width="12" height="160" fill="rgba(255,255,255,0.5)" rx="3"/>
    <!-- 文字线条 -->
    <line x1="40" y1="85" x2="105" y2="92" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="110" x2="105" y2="117" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="135" x2="90" y2="142" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="92" x2="215" y2="85" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="117" x2="215" y2="110" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="142" x2="200" y2="135" stroke="rgba(102,126,234,0.3)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
